<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#eab308" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Inner Golden Subtle Border -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#eab308" stroke-width="2" stroke-opacity="0.3" />

  <!-- Center Glow -->
  <circle cx="256" cy="200" r="140" fill="#eab308" opacity="0.12" filter="blur(30px)" />

  <!-- Golden G Monogram -->
  <g transform="translate(156, 75) scale(1.05)" filter="url(#shadow)">
    <path d="M 155 60 C 138 35 108 24 78 32 C 42 42 22 75 22 110 C 22 152 54 182 98 182 C 142 182 172 150 174 108 L 100 108 L 100 84 L 198 84 C 200 92 200 102 200 112 C 200 168 156 204 98 204 C 40 204 0 162 0 110 C 0 54 44 8 100 0 C 140 -5 178 12 202 46 Z" fill="url(#gold)" />
    <path d="M 150 58 C 134 36 106 26 78 34 C 44 44 26 74 24 106 C 26 78 44 52 76 42 C 104 34 132 44 148 64 Z" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- GLOVAL Brand Text -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#textGold)" letter-spacing="12" text-anchor="middle">GLOVAL</text>
  
  <!-- Sub Text -->
  <text x="256" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#94a3b8" letter-spacing="6" text-anchor="middle">SFA &amp; CRM</text>
</svg>
